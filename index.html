<html lang="en" x-data="itemsData">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title x-text="client.name"></title>
    <link
      rel="shortcut icon"
      href="./assets/images/kudino-purpel-monogram.svg"
      type="image/x-icon"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap");
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body
    class="overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-gray-300"
  >
    <!-- Invoice -->
    <div
      class="print:p-0 print:m-0 max-w-[85rem] px-4 sm:px-6 lg:px-8 mx-auto my-4 sm:my-10"
    >
      <div class="print:w-full sm:w-11/12 lg:w-3/4 mx-auto">
        <!-- Card -->
        <div
          class="print:shadow-none flex flex-col p-4 sm:p-10 bg-white shadow-md rounded-xl"
        >
          <!-- Grid -->
          <div class="flex justify-between">
            <div>
              <img
                :src="billing.logo"
                class="print:h-6 h-10"
                alt=""
                srcset=""
              />
            </div>
            <!-- Col -->

            <div class="text-end">
              <h2
                class="print:text-lg text-2xl font-semibold text-gray-800"
                x-text="billing.matricule"
              ></h2>
              <dd
                class="print:text-xs col-span-2 text-gray-500"
                x-text="billing.date"
              ></dd>
              <address
                class="print:text-xs not-italic text-gray-800"
                x-text="billing.location"
              ></address>
            </div>
            <!-- Col -->
          </div>
          <!-- End Grid -->

          <!-- Grid -->
          <div class="print:mt-4 mt-8 grid sm:grid-cols-2 gap-3">
            <div>
              <div class="flex gap-x-2 items-start">
                <span
                  class="flex shrink-0 justify-center items-center size-7 bg-white border border-gray-200 text-[10px] font-light text-lg uppercase text-gray-600 rounded-lg"
                >
                  <i class="ri-service-line"></i>
                </span>
                <div>
                  <h3 class="print:text-xs font-semibold text-gray-800">
                    Recipient
                  </h3>
                  <h3
                    class="print:text-xs text-lg text-gray-600"
                    x-text="client.name"
                  ></h3>
                </div>
              </div>
            </div>
            <div>
              <div class="flex gap-x-2 items-start">
                <span
                  class="flex shrink-0 justify-center items-center size-7 bg-white border border-gray-200 text-[10px] font-light text-lg uppercase text-gray-600 rounded-lg"
                >
                  <i class="ri-map-pin-line"></i>
                </span>
                <div>
                  <h3 class="print:text-xs font-semibold text-gray-800">
                    Address
                  </h3>
                  <address
                    class="print:text-xs text-lg font-normal not-italic text-gray-600"
                    x-text="client.adresse"
                  ></address>
                </div>
              </div>
            </div>
          </div>
          <!-- End Grid -->
          <div
            x-show="info_banner.title"
            :class="`bg-${info_banner.color}-50 mt-4 border-s-8 rounded-lg border-${info_banner.color}-500 p-4`"
          >
            <div class="flex">
              <div class="shrink-0">
                <!-- Icon -->
                <span
                  :class="`inline-flex justify-center items-center size-8 rounded-full border-4 border-${info_banner.color}-100 bg-${info_banner.color}-200 text-${info_banner.color}-800`"
                >
                  <i class="ri-information-line"></i>
                </span>
                <!-- End Icon -->
              </div>
              <div class="ms-3">
                <h3
                  class="print:text-xs text-gray-800 font-semibold"
                  x-text="info_banner.title"
                ></h3>
                <p
                  class="print:text-xs text-sm text-gray-700"
                  x-text="info_banner.message"
                ></p>
              </div>
            </div>
          </div>
          <div
            x-show="payment.RIB"
            class="bg-neutral-50 mt-4 border-s-8 rounded-lg border-neutral-500 p-4"
          >
            <div class="ms-3">
              <div class="flex gap-2">
                <i class="ri-bank-fill"></i>
                <h3
                  class="print:text-sm text-gray-800 font-semibold"
                  x-text="payment.Bank"
                ></h3>
              </div>
              <div class="grid grid-cols-2 font-light">
                <p class="print:text-xs text-sm text-gray-700">
                  <span class="font-normal">Holder :</span>
                  <span x-text="payment.holder"></span>
                </p>
                <p class="print:text-xs text-sm text-gray-700">
                  <span class="font-normal">Code_SWIFT :</span>
                  <span x-text="payment.Code_SWIFT"></span>
                </p>
                <p class="print:text-xs text-sm text-gray-700">
                  <span class="font-normal">RIB :</span>
                  <span x-text="payment.RIB"></span>
                </p>
                <p class="print:text-xs text-sm text-gray-700">
                  <span class="font-normal">IBAN :</span>
                  <span x-text="payment.IBAN"></span>
                </p>
              </div>
            </div>
          </div>
          <!-- Table -->
          <div class="mt-6">
            <div
              class="print:p-2 border border-b-0 border-gray-200 p-4 rounded-t-lg"
            >
              <h1
                class="print:text-sm text-center font-semibold"
                x-text="title"
              ></h1>
            </div>
            <div class="border border-gray-200 p-4 rounded-b-lg space-y-4">
              <div>
                <template x-for="(item, index) in items" :key="index + 1">
                  <div>
                    <div class="flex gap-x-3">
                      <!-- Icon -->
                      <div
                        class="relative last:after:hidden after:absolute after:top-7 after:bottom-0 after:start-3.5 after:w-px after:-translate-x-[0.5px] after:bg-gray-200"
                      >
                        <div
                          class="relative z-10 size-7 flex justify-center items-center"
                        >
                          <span
                            class="flex shrink-0 justify-center items-center size-7 bg-white border border-gray-200 text-[10px] font-semibold uppercase text-gray-600 rounded-full"
                          >
                            <i class="ri-stack-line text-lg font-light"></i>
                          </span>
                        </div>
                      </div>
                      <!-- End Icon -->

                      <!-- Right Content -->
                      <div class="print:pb-2 grow pt-0.5 pb-8">
                        <h3
                          class="print:text-sm flex gap-x-1.5 font-semibold text-gray-800"
                          x-text="item.title"
                        ></h3>
                        <p
                          class="print:text-xs mt-1 text-sm text-gray-600"
                          x-text="item.description"
                        ></p>
                        <ul
                          class="print:text-xs marker:text-gray-600 list-disc ps-8 pt-2 text-sm text-gray-600"
                        >
                          <template
                            x-for="option in item.options"
                            :key="option"
                          >
                            <li x-text="option"></li>
                          </template>
                        </ul>
                      </div>
                      <!-- End Right Content -->
                    </div>
                    <!-- End Item -->
                    <div class="text-end text-xs font-bold space-x-2">
                      <span
                        x-show="!billing.pricing || !billing.quantity"
                        class="print:text-xs text-purple-600 uppercase bg-purple-100 px-2 py-1 rounded-lg"
                        x-text="index + 1"
                      ></span>
                      <span
                        x-show="billing.pricing"
                        class="print:text-xs text-emerald-600 uppercase bg-emerald-100 px-2 py-1 rounded-lg"
                        x-text="item.price +' '+ billing.currency"
                      ></span>
                      <span
                        x-show="billing.quantity"
                        class="print:text-xs text-gray-600 uppercase bg-gray-100 px-2 py-1 rounded-lg"
                        x-text="'QTE :' + item.quantity"
                      ></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
          <!-- End Table -->

          <!-- Flex -->
          <div class="mt-8 flex sm:justify-end">
            <div class="w-full max-w-2xl sm:text-end space-y-2">
              <!-- Grid -->
              <div class="grid grid-cols-2 sm:grid-cols-1 gap-3 sm:gap-2">
                <!-- Total HT (before tax) -->
                <dl x-show="billing.HT" class="grid sm:grid-cols-5 gap-x-3">
                  <dt
                    class="print:text-xs col-span-3 font-semibold text-gray-800"
                  >
                    Before tax:
                  </dt>
                  <dd
                    class="print:text-xs col-span-2 text-gray-500"
                    x-text="billing.HT.toFixed(2) + ' ' + billing.currency"
                  ></dd>
                </dl>

                <!-- TVA (Value Added Tax) -->
                <dl
                  x-show="billing.TVA_amount"
                  class="grid sm:grid-cols-5 gap-x-3"
                >
                  <dt
                    class="print:text-xs col-span-3 font-semibold text-gray-800"
                  >
                    Tax ( <span x-text="billing.TVA"></span>%):
                  </dt>
                  <dd
                    class="print:text-xs col-span-2 text-gray-500"
                    x-text="billing.TVA_amount.toFixed(2) + ' ' + billing.currency"
                  ></dd>
                </dl>

                <!-- Total TTC (All Taxes Included) -->
                <dl x-show="billing.TTC" class="grid sm:grid-cols-5 gap-x-3">
                  <dt
                    class="print:text-xs col-span-3 font-semibold text-gray-800"
                  >
                    All Taxes Included:
                  </dt>
                  <dd
                    class="print:text-xs col-span-2 text-gray-500"
                    x-text="billing.TTC.toFixed(2) + ' ' + billing.currency"
                  ></dd>
                </dl>

                <!-- Reduction (Discounts) -->
                <dl
                  x-show="billing.reduce_price"
                  class="grid sm:grid-cols-5 gap-x-3"
                >
                  <dt
                    class="print:text-xs col-span-3 font-semibold text-gray-800"
                  >
                    Discounts:
                  </dt>
                  <dd
                    class="print:text-xs col-span-2 text-red-500"
                    x-text="'- ' +billing.reduce_price.toFixed(2) + ' ' + billing.currency"
                  ></dd>
                </dl>

                <!-- Total Amount After Reduction -->
                <dl
                  x-show="billing.total_price_amount"
                  class="grid sm:grid-cols-5 gap-x-3"
                >
                  <dt
                    class="print:text-xs col-span-3 font-semibold text-gray-800"
                  >
                    Total Amount :
                  </dt>
                  <dd
                    class="print:text-xs col-span-2 font-semibold text-emerald-500"
                    x-text="billing.total_price_amount.toFixed(2) + ' ' + billing.currency"
                  ></dd>
                </dl>

                <!-- Advance Payment -->
                <dl
                  x-show="billing.advance_paiment"
                  class="grid sm:grid-cols-5 gap-x-3"
                >
                  <dt
                    class="print:text-xs col-span-3 font-semibold text-gray-800"
                  >
                    Advance Payment:
                  </dt>
                  <dd
                    class="print:text-xs col-span-2 font-semibold text-blue-500"
                    x-text="billing.advance_paiment.toFixed(2) + ' ' + billing.currency"
                  ></dd>
                </dl>

                <!-- Remaining Amount -->
                <!-- <dl class="grid sm:grid-cols-5 gap-x-3">
                                <dt class="print:text-xs col-span-3 font-semibold text-gray-800">Remaining Amount Due:
                                </dt>
                                <dd class="print:text-xs col-span-2 font-semibold text-green-500"
                                    x-text="(billing.total_price_amount - billing.advance_paiment).toFixed(2) + ' ' + billing.currency">
                                </dd>
                            </dl> -->
              </div>

              <!-- End Grid -->
            </div>
          </div>
          <!-- End Flex -->

          <div class="mt-8 sm:mt-12">
            <h4
              class="print:text-xs text-lg font-semibold text-gray-800"
              x-text="billing.footer.title"
            ></h4>
            <p
              class="print:text-xs text-gray-500"
              x-text="billing.footer.description"
            ></p>
            <div class="mt-2">
              <template x-for="contact in billing.contact">
                <p
                  class="print:text-xs block text-sm font-medium text-gray-800"
                  x-text="contact"
                ></p>
              </template>
            </div>
          </div>

          <p class="mt-5 text-sm text-gray-500" x-text="billing.copyright"></p>
        </div>
        <!-- End Card -->

        <!-- Buttons -->
        <div class="print:hidden mt-6 flex justify-end gap-x-3">
          <a
            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none focus:outline-none focus:bg-gray-50"
            href="#"
          >
            <i class="ri-download-2-line font-bold"></i>
            Download PDF
          </a>
          <button
            onclick="print()"
            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 focus:outline-none focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none"
          >
            <i class="ri-printer-line font-normal"></i>
            Print
          </button>
        </div>
        <!-- End Buttons -->
      </div>
    </div>
    <!-- End Invoice -->
  </body>
  <!-- <script src="./assets/js/main.js"></script> -->
  <!-- <script src="./assets/js/ibarhim_almoubarak.js"></script> -->
  <script src="./assets/js/hasnawi.js"></script>
</html>
